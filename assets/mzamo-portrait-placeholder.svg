<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091124" />
      <stop offset="50%" stop-color="#050a17" />
      <stop offset="100%" stop-color="#030610" />
    </linearGradient>
    <linearGradient id="glowRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#0066ff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0066ff" stop-opacity="0.1" />
    </linearGradient>
    <radialGradient id="ambientLight" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#0066ff" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#00d2ff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="750" fill="url(#bgGrad)" />

  <!-- Ambient Light Center -->
  <circle cx="300" cy="280" r="280" fill="url(#ambientLight)" />

  <!-- Subtle Digital Geometry in background -->
  <g stroke="#00d2ff" stroke-opacity="0.12" stroke-width="1">
    <circle cx="300" cy="270" r="180" stroke-dasharray="4 8" />
    <circle cx="300" cy="270" r="140" />
    <line x1="120" y1="270" x2="480" y2="270" stroke-dasharray="2 6" />
    <line x1="300" y1="90" x2="300" y2="450" stroke-dasharray="2 6" />
  </g>

  <!-- Silhouette / Professional Developer Pose -->
  <g id="silhouette">
    <!-- Shoulders & Torso with tailored blazer cut -->
    <path d="M140 680 C140 540, 200 480, 250 460 L270 455 C275 455, 280 470, 300 470 C320 470, 325 455, 330 455 L350 460 C400 480, 460 540, 460 680 Z" fill="url(#avatarGrad)" />
    <!-- Subtle blazer rim highlight -->
    <path d="M140 680 C140 540, 200 480, 250 460 L270 455 C275 455, 280 470, 300 470 C320 470, 325 455, 330 455 L350 460 C400 480, 460 540, 460 680" stroke="url(#glowRim)" stroke-width="2" fill="none" opacity="0.6" />

    <!-- Shirt / Collar -->
    <path d="M270 455 L300 530 L330 455 L320 450 L300 480 L280 450 Z" fill="#334155" opacity="0.8" />
    <!-- Neck -->
    <path d="M268 370 C268 430, 275 455, 300 455 C325 455, 332 430, 332 370 Z" fill="#1e293b" />
    <!-- Neck light reflection -->
    <path d="M272 380 C272 430, 280 448, 290 452" stroke="#00d2ff" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />

    <!-- Head / Jawline -->
    <path d="M225 270 C225 180, 255 150, 300 150 C345 150, 375 180, 375 270 C375 340, 345 385, 300 385 C255 385, 225 340, 225 270 Z" fill="url(#avatarGrad)" />
    
    <!-- Hairline / Profile edge subtle rim lighting -->
    <path d="M232 230 C230 180, 260 155, 300 155 C340 155, 370 180, 368 230" stroke="#00d2ff" stroke-width="2.5" stroke-linecap="round" opacity="0.7" filter="url(#softGlow)" />
    <path d="M227 250 C225 315, 245 365, 300 382" stroke="#0066ff" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- High-tech HUD / Framing overlay elements -->
  <g opacity="0.75">
    <!-- Top-left corner bracket -->
    <path d="M40 70 L40 40 L70 40" stroke="#00d2ff" stroke-width="2.5" stroke-linecap="round" />
    <!-- Top-right corner bracket -->
    <path d="M560 70 L560 40 L530 40" stroke="#00d2ff" stroke-width="2.5" stroke-linecap="round" />
    <!-- Bottom-left corner bracket -->
    <path d="M40 680 L40 710 L70 710" stroke="#00d2ff" stroke-width="2.5" stroke-linecap="round" />
    <!-- Bottom-right corner bracket -->
    <path d="M560 680 L560 710 L530 710" stroke="#00d2ff" stroke-width="2.5" stroke-linecap="round" />

    <!-- Subtle framing line -->
    <rect x="35" y="35" width="530" height="680" rx="12" stroke="#0066ff" stroke-opacity="0.25" stroke-width="1" />
  </g>

  <!-- Tag / Identity Badge at the bottom of frame -->
  <g transform="translate(180, 640)">
    <rect x="0" y="0" width="240" height="42" rx="21" fill="#050b18" fill-opacity="0.85" stroke="#00d2ff" stroke-opacity="0.4" stroke-width="1.2" />
    <circle cx="24" cy="21" r="5" fill="#00d2ff">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <text x="40" y="26" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#93c5fd" letter-spacing="1.5">MZAMO MAGUDULELA</text>
  </g>
</svg>
